<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training Master</title>
<meta name="description" content="Plan de antrenament, meniu cu porții calculate și jurnal de progres, pe profilul tău.">
<meta name="theme-color" content="#141619">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training Master">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Manrope (SIL Open Font License, vezi fonts/OFL-Manrope.txt), inclus în aplicație ca să meargă și fără internet */
@font-face{font-family:'Manrope';font-style:normal;font-display:swap;font-weight:200 800;src:url(fonts/manrope-latin-ext-wght-normal.woff2) format('woff2-variations');unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Manrope';font-style:normal;font-display:swap;font-weight:200 800;src:url(fonts/manrope-latin-wght-normal.woff2) format('woff2-variations');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --bg:#141619; --surface:#1D2025; --surface-2:#272B32; --line:#353A43;
  --text:#EFEBE3; --muted:#959CA7; --good:#5DBB8A; --warn:#E0B552; --danger:#E0736B;
  --accent:#DB7440; --accent-dim:#7A3F1E; --anim-outline:#0D0F12; --map-base:#3A414B; --map-line:rgba(0,0,0,.35); --anim-pad:#2B3037; --anim-padhi:#4B535E; --anim-metal:#6E7682; --anim-metal2:#3B4149; --anim-steel:#A9B0BA; --anim-floor:#191C20; --anim-body:#E6E0D6; --anim-body2:#7D838D; --anim-hair:#2B2420; --anim-mp:var(--accent); --anim-ms:rgba(219,116,64,.45); --glow:rgba(219,116,64,.26);
  --r:14px; --tab-h:62px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-feature-settings:"tnum" 0;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body.noscroll{overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
[hidden]{display:none!important}
h1,h2,h3,h4,p{margin:0}
small{font-size:12.5px;color:var(--muted);font-weight:400}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{max-width:560px;margin:0 auto;padding:0 16px calc(var(--tab-h) + 96px + env(safe-area-inset-bottom))}
#banner{background:#3A2E14;color:#F3DFA6;font-size:13px;padding:10px 16px calc(10px);padding-top:calc(10px + env(safe-area-inset-top));text-align:center}

.top{display:flex;justify-content:space-between;align-items:flex-end;padding:calc(18px + env(safe-area-inset-top)) 0 14px}
.eyebrow{color:var(--accent);font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
h1{font-size:29px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:3px;text-wrap:balance}
h2{font-size:21px;font-weight:800;letter-spacing:-.01em}
h3{font-size:16px;font-weight:700;margin-bottom:10px}
h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px}
.lead{color:var(--muted);margin:0 0 16px;font-size:15px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--accent-dim);border:2px solid var(--accent);font-weight:800;font-size:17px;flex:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.note{border-left:3px solid var(--accent)}
.card.note p{color:var(--muted);font-size:14px;margin-top:4px}
.card.note.warn{border-left-color:var(--warn)} .card.note.good{border-left-color:var(--good)}
.card.note .btn{margin-top:10px}
.fine{font-size:13px;color:var(--muted);line-height:1.5}
.fine.pad{padding:8px 4px 0}
.kv{color:var(--muted);font-size:14px;margin-bottom:4px}

/* butoane */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:12px;background:var(--accent);color:#15110D;font-weight:700;font-size:15px;text-decoration:none;white-space:nowrap}
.btn:active{filter:brightness(.88)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.small{min-height:38px;padding:0 13px;font-size:13.5px;border-radius:10px}
.btn.big{width:100%;min-height:54px;font-size:16px;margin-top:8px}
.btn.danger{color:var(--danger)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin:12px 0}
.row2 .btn{padding:6px 10px;white-space:normal;text-align:center;line-height:1.2}
.icon{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);font-size:20px;color:var(--muted);flex:none}

/* săptămâna */
.week{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14.5px}
.week small{display:block;margin-top:2px}
.week b{font-size:17px}
.plates{display:flex;gap:5px;flex:none}
.plate{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);position:relative}
.plate::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--bg)}
.plate.on{border-color:var(--accent);background:var(--accent-dim)}

/* zile */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:112px;text-align:left;padding:10px 13px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:1px}
.chip b{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.chip span{font-size:14px;font-weight:600}
.chip i{font-style:normal;font-size:11px;color:var(--accent);font-weight:700}
.chip.on{background:var(--accent-dim);border-color:var(--accent)}
.chip.on b,.chip.on i{color:var(--text)}
.dayhead{margin:4px 0 12px}
.dayhead p{color:var(--muted);font-size:13.5px;margin-top:2px}

/* exerciții */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.ex.open{border-color:var(--accent)}
.ex-head{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;text-align:left}
.ring{flex:none;width:44px;height:44px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.ex.complete .ring{border-color:var(--good);background:rgba(93,187,138,.14);color:var(--good);font-size:18px}
.ex-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ex-txt b{font-size:15.5px;line-height:1.25}
.chev{color:var(--muted);font-size:22px;transition:transform .15s}
.ex.open .chev{transform:rotate(90deg)}
.ex-body{padding:2px 14px 16px;border-top:1px solid var(--line)}
.anim{position:relative;margin:12px 0 0;background:var(--surface-2);border-radius:12px;color:var(--text);overflow:hidden}
.anim svg{display:block;width:100%;height:auto;max-height:240px}
.anim-btn{position:absolute;right:8px;top:8px;min-height:32px;padding:0 11px;border-radius:9px;background:rgba(20,22,25,.72);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--muted)}
.anim-cap{position:absolute;left:10px;top:9px;font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.02em}
.sug{font-size:13.5px;color:var(--text);background:var(--surface-2);border-radius:10px;padding:10px 12px;margin:12px 0}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:flex;align-items:center;gap:8px}
.sn{width:18px;text-align:center;font-size:13px;color:var(--muted);font-weight:700;flex:none}
.unit{font-size:12.5px;color:var(--muted);flex:none}
.in{width:100%;min-width:0;height:48px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);padding:0 12px;font-size:17px;font-variant-numeric:tabular-nums}
.set .in{text-align:center;padding:0 6px}
.in::placeholder{color:#6A717C}
.in:focus{outline:none;border-color:var(--accent)}
.chk{flex:none;width:48px;height:48px;border-radius:11px;border:2px solid var(--line);font-size:20px;color:var(--line)}
.set.ok .chk{background:var(--good);border-color:var(--good);color:#0E1A13}
.set.ok .in{border-color:rgba(93,187,138,.5);color:var(--good)}
.ex-actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}

details.how{margin-top:12px;border-top:1px solid var(--line);padding-top:4px}
details.how summary{list-style:none;padding:10px 0;font-weight:700;font-size:14px;cursor:pointer;display:flex;justify-content:space-between}
details.how summary::-webkit-details-marker{display:none}
details.how summary::after{content:"+";color:var(--muted);font-size:18px;line-height:1}
details.how[open] summary::after{content:"−"}
details.how p,details.how li{font-size:14px;line-height:1.55}
details.how p{margin-bottom:8px;color:var(--muted)}
details.how p b{color:var(--text)}
details.how ol,details.how ul{margin:0;padding-left:20px}
details.how li{margin-bottom:5px}
details.how ul li{color:#E9B9AC}
details.how ul li b{color:var(--text)}
.card details.how ul li{color:var(--muted)}
.en{white-space:nowrap}
.tip{background:var(--surface-2);border-left:3px solid var(--accent);border-radius:8px;padding:9px 12px;margin-top:10px;color:var(--text)!important}
.rest{margin-top:10px}

/* cronometru */
#timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 10px + env(safe-area-inset-bottom));width:min(528px,calc(100% - 24px));z-index:30;background:var(--surface-2);border:1px solid var(--accent);border-radius:14px;display:flex;align-items:center;gap:6px;padding:8px 8px 8px 16px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#timer-fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent-dim);opacity:.55;transition:width .25s linear}
#timer-t{position:relative;flex:1;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
#timer button{position:relative;min-width:48px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:700;padding:0 10px}
#timer.fin{border-color:var(--good)} #timer.fin #timer-fill{background:var(--good);opacity:.25}

/* nutriție */
.bar{margin-bottom:12px}
.bar-l{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);margin-bottom:5px}
.bar-l b{color:var(--text);font-size:15px}
.track{height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.track i{display:block;height:100%;border-radius:5px;background:var(--accent);transition:width .3s}
.track i.alt{background:var(--good)}
.water{display:flex;justify-content:space-between;align-items:center;gap:12px}
.water small{display:block}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);font-size:22px}
.stepper span{min-width:48px;text-align:center;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px}
.meal.open{border-color:var(--accent)}
.meal-head{display:flex;align-items:center;gap:10px;padding:12px}
.mchk{flex:none;width:44px;height:44px;border-radius:12px;border:2px solid var(--line);font-size:19px;color:var(--line)}
.mchk.on{background:var(--good);border-color:var(--good);color:#0E1A13}
.meal-txt{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:3px}
.meal-txt small{text-transform:uppercase;letter-spacing:.04em;font-size:11px;font-weight:700;color:var(--accent)}
.meal-txt b{font-size:15px;line-height:1.3}
.meal.eaten .meal-txt b{color:var(--muted)}
.meal-body{padding:0 14px 14px;border-top:1px solid var(--line)}
.ingr{margin:12px 0;padding:0;list-style:none}
.ingr li{padding:8px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.ingr li:last-child{border-bottom:0}
.prep{font-size:14px;line-height:1.55;margin-bottom:8px}

/* progres */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div,.tgrid div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
.stats b,.tgrid b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.stats span,.tgrid span{font-size:11.5px;color:var(--muted)}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.tgrid div{background:var(--surface-2);padding:10px 4px}
.tgrid b{font-size:16px}
.bwrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-bottom:10px}
.bwrow label,.fld{display:block;font-size:12.5px;color:var(--muted)}
.bwrow .in,.fld .in{margin-top:5px}
.bwrow .btn{height:48px}
.spark{width:100%;height:56px;margin:6px 0}
.advice{border-radius:10px;padding:11px 12px;font-size:14px;background:var(--surface-2);border-left:3px solid var(--muted);margin:8px 0}
.advice.good{border-left-color:var(--good)} .advice.warn{border-left-color:var(--warn)}
.advice .btn{margin-top:10px}
.list{list-style:none;margin:8px 0 0;padding:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.list li:last-child{border-bottom:0}
.list span{min-width:0}
.list small{display:block}
.list b{flex:none;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.list.tap li{cursor:pointer;min-height:52px}
.list.tap b{color:var(--accent)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.hist{border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
.hist-head{width:100%;display:flex;justify-content:space-between;gap:10px;padding:12px 0;text-align:left;font-size:14px}
.hist-head b{flex:none;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.hist-body{padding:0 0 12px}
.hist-body p{font-size:13.5px;color:var(--muted);margin-bottom:8px}
.hist-body p b{color:var(--text)}
.plan{margin:8px 0;padding:0;list-style:none;counter-reset:d}
.plan li{counter-increment:d;display:flex;flex-direction:column;padding:9px 0 9px 40px;position:relative;border-bottom:1px solid var(--line)}
.plan li:last-child{border-bottom:0}
.plan li::before{content:counter(d);position:absolute;left:0;top:10px;width:28px;height:28px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;font-size:13px;font-weight:800}
.plan span{font-size:13px;color:var(--muted)}

/* formular */
.fld{margin-bottom:14px}
.fld>span{display:block;margin-bottom:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{flex:1 1 30%;min-width:88px;position:relative}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:50px;height:100%;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--text)}
.opt span b{font-size:14.5px;font-weight:600}
.opt span small{font-size:11.5px;line-height:1.3}
.opt input:checked+span{border-color:var(--accent);background:var(--accent-dim)}
.opt input:checked+span small{color:var(--text)}
.opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.card>.opts .opt{flex-basis:100%}
.opts.sw .opt{flex:none;min-width:0;width:48px}
.swatch span{min-height:48px;padding:0;background:var(--c)!important;border:3px solid transparent}
.swatch input:checked+span{border-color:var(--text)}
.hint{display:block;margin-top:7px}

/* bara de jos */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(20,22,25,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab-h)}
#tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600}
#tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--accent)}

/* foi */
#sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
#sheet-in{width:100%;max-width:560px;max-height:86vh;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--line);padding:22px 18px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
#sheet-in h3{font-size:20px;font-weight:800;margin-bottom:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 76px + env(safe-area-inset-bottom));z-index:50;background:var(--text);color:#15171A;font-size:14px;font-weight:600;padding:10px 16px;border-radius:999px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.5)}

@media (max-width:359px){.tgrid{grid-template-columns:repeat(2,1fr)}.bwrow{grid-template-columns:1fr 1fr}.bwrow .btn{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@supports (color: color-mix(in srgb, red 50%, transparent)){
  :root{--anim-ms:color-mix(in srgb, var(--accent) 45%, transparent);--glow:color-mix(in srgb, var(--accent) 30%, transparent)}
}

/* ---------- v2.2: antrenamentul de azi ---------- */
.hero{position:relative;border-radius:20px;padding:18px 16px 16px;margin-bottom:12px;border:1px solid var(--line);overflow:hidden;
  background:radial-gradient(130% 95% at 100% 0%, var(--glow) 0%, transparent 62%), linear-gradient(180deg,#23272D,#1B1E23)}
.hero-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.hero h2{font-size:27px;margin-top:5px;line-height:1.1}
.hero .mus{margin-top:14px}
.hero-stats{display:flex;gap:18px;margin:14px 0 6px;color:var(--muted);font-size:13px}
.hero-stats b{color:var(--text);font-size:16px;margin-right:2px;font-variant-numeric:tabular-nums}
.hero .btn.big{margin-top:10px;box-shadow:0 6px 18px -6px var(--glow)}
.hero-done{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding:10px 10px 10px 14px;border-radius:12px;background:rgba(93,187,138,.12);color:var(--good);font-weight:700;font-size:14px}
.pring{position:relative;width:64px;height:64px;flex:none}
.pring svg{width:100%;height:100%;display:block}
.pr-bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:5.5}
.pr-fg{fill:none;stroke:var(--accent);stroke-width:5.5;stroke-linecap:round;transition:stroke-dasharray .45s ease}
.pring span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;color:var(--muted);line-height:1.15;text-align:center}
.pring em{font-style:normal;white-space:nowrap}
.pring b{font-size:17px;color:var(--text)}
.pring small{font-size:10.5px}
.sec{font-size:11.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:22px 2px 10px;font-weight:700}
.week{padding:13px 16px}

/* grupe musculare */
.mus{display:flex;flex-wrap:wrap;gap:6px}
.mu{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;line-height:1;white-space:nowrap}
.mu.p{background:var(--accent);color:#17120E}
.mu.s{background:var(--anim-ms);color:var(--text)}

/* rândul exercițiului */
.ex-head{gap:12px;padding:10px 12px}
.anim-thumb{width:62px;height:50px;border-radius:11px;background:var(--surface-2);flex:none;overflow:hidden;display:block}
.anim-thumb svg{width:100%;height:100%;display:block}
.ex-txt small.tgt{color:var(--text);opacity:.8;font-weight:600}
.ex .ring{width:40px;height:40px;font-size:12px;border-width:2.5px}
.ex.complete .anim-thumb{box-shadow:inset 0 0 0 2px var(--good)}
.anim{margin-top:12px}
.anim .mus{position:relative;padding:2px 10px 11px}
.anim-btn{width:38px;min-height:34px;padding:0;font-size:12px;letter-spacing:-.05em}

/* nutriție */
.nut{display:flex;gap:16px;align-items:center}
.kring{position:relative;width:122px;height:122px;flex:none}
.kring svg{width:100%;height:100%;display:block}
.kr-bg{fill:none;stroke:var(--surface-2);stroke-width:9}
.kr-fg{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transition:stroke-dasharray .45s ease}
.kring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.15}
.kring b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.kring span{font-size:11.5px;color:var(--muted)}
.kring small{font-size:11px}
.macros{flex:1;min-width:0}
.macros .bar{margin-bottom:10px}
.macros .bar:last-child{margin-bottom:0}
.macros .bar-l{font-size:12.5px}
.macros .bar-l b{font-size:14px}
.track i.mp{background:var(--good)} .track i.mc{background:#6FA8E6} .track i.mf{background:var(--warn)}
.fine.pad0{margin:-2px 4px 14px}

/* onboarding pe pași */
.steps{display:flex;gap:6px;margin:0 0 16px}
.steps span{flex:1;height:5px;border-radius:3px;background:var(--line);transition:background .3s}
.steps span.on{background:var(--accent)} .steps span.done{background:var(--accent-dim)}
.row2.wiz{margin-top:16px}
.row2.wiz .btn{min-height:54px;font-size:16px}

@media (max-width:359px){.nut{flex-direction:column;align-items:stretch}.kring{margin:0 auto}.hero-stats{gap:12px}}

/* ---------- v2.3: finisaje ---------- */
.card{box-shadow:inset 0 1px 0 rgba(255,255,255,.035)}
h1{letter-spacing:-.03em}
.avatar{box-shadow:0 0 0 4px var(--bg),0 0 0 5px var(--line);transition:transform .15s}
.avatar:active{transform:scale(.94)}
#tabs button{transition:color .2s}
#tabs svg{box-sizing:content-box;padding:4px 16px;border-radius:999px;transition:background .2s}
#tabs button.on svg{background:var(--glow)}
.btn{transition:filter .15s, transform .1s}
.btn:active{transform:scale(.98)}
.ex,.meal{transition:border-color .2s}
.anim{background:radial-gradient(120% 90% at 50% 0%, #2C3138 0%, var(--surface-2) 70%)}
.vchart{display:flex;gap:7px;align-items:flex-end;height:120px;margin:6px 0 10px}
.vb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}
.vb i{display:block;width:100%;border-radius:7px 7px 3px 3px;background:var(--surface-2);min-height:4px;transition:height .4s ease}
.vb.cur i{background:var(--accent)}
.vb.has i{background:var(--accent-dim)}
.vb.cur.has i{background:var(--accent)}
.vb span{font-size:10px;color:var(--muted);white-space:nowrap}
.vb b{font-size:10px;color:var(--text);font-weight:700;min-height:12px}

/* ---------- v2.5: alegerea antrenamentului ---------- */
.bmap{display:block}
.bmap text{font-size:5.2px;fill:var(--muted);font-family:inherit;letter-spacing:.02em}
.hero-body{display:flex;gap:12px;align-items:center;margin-top:12px}
.hero-body .bmap{width:92px;flex:none}
.hero-body .mus{margin-top:0;align-content:center}
.linkbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:44px;margin-top:6px;color:var(--accent);font-weight:700;font-size:14px;border-radius:12px}
.linkbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.linkbtn:active{background:rgba(255,255,255,.04)}
.chip.more{border-style:dashed;background:transparent}
.chip.more i{font-size:16px;line-height:1;color:var(--accent)}
.jumps{display:flex;gap:6px;overflow-x:auto;margin:12px -18px 4px;padding:0 18px 4px;scrollbar-width:none;position:sticky;top:-22px;z-index:2;background:var(--surface);padding-top:10px}
.jumps::-webkit-scrollbar{display:none}
.jumps button{flex:none;font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:999px;border:1px solid var(--line);color:var(--text);background:var(--surface-2);white-space:nowrap}
.pk{margin-top:18px}
.pk h4{display:flex;align-items:center;gap:8px;font-size:15px;text-transform:none;letter-spacing:0;color:var(--text);margin:0 0 4px}
.pk>.fine{margin-bottom:10px}
.wgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.wcard{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px 10px 12px;transition:border-color .2s, transform .1s}
.wcard:active{transform:scale(.98)}
.wcard .bmap{width:100%;height:auto;max-height:96px;border-radius:10px;background:radial-gradient(90% 90% at 50% 30%, #2E343C, #23272D);padding:6px 0 2px}
.wcard.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wtxt{display:flex;flex-direction:column;gap:3px;min-width:0}
.wtxt b{font-size:14px;line-height:1.25}
.wtxt small{font-size:11.5px;line-height:1.3}
.wtxt em{font-style:normal;font-size:11.5px;color:var(--muted);font-weight:600}
.badge{display:inline-block;align-self:flex-start;font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#17120E;background:var(--accent);border-radius:999px;padding:3px 7px}

</style>
</head>

<main id="app"></main>

<div id="timer" hidden>

</div>

  <button data-act="tab" data-tab="food"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v8M4.5 3v4.5a2.5 2.5 0 0 0 5 0V3M7 11v10M17 3c-2 1.5-3 4-3 7h3zm0 7v11"/></svg>Nutriție</button>

</div></nav>

/* ============ CALCULE: ținte nutriționale, program, porții, progresie ============ */

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isFinite(n) ? n : null; };

function ymd(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function parseYmd(s) { const a = s.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); }
function daysBetween(a, b) { return Math.round((parseYmd(b) - parseYmd(a)) / 86400000); }
function mondayOf(s) { const d = parseYmd(s); const wd = d.getDay(); d.setDate(d.getDate() + (wd === 0 ? -6 : 1 - wd)); return ymd(d); }

/* Greutatea curentă = ultima cântărire */
function curWeight(p) { return p.bw && p.bw.length ? p.bw[p.bw.length - 1].w : p.w; }

/* Ținte zilnice: Mifflin-St Jeor + nivel de activitate + obiectiv */
function targets(p) {
  const w = curWeight(p);
  const bmr = 10 * w + 6.25 * p.h - 5 * p.age + (p.sex === 'f' ? -161 : 5);
  const af = ({sed: 1.4, mod: 1.55, act: 1.7}[p.act] || 1.55) + (p.days - 4) * 0.025;
  const tdee = bmr * af;
  const bmi = w / Math.pow(p.h / 100, 2);
  let goal = p.goal, note = '';
  if (goal === 'slab' && bmi < 18.5) { goal = 'ton'; note = 'Greutatea ta este deja sub intervalul sănătos pentru înălțime, așa că am calculat calorii de menținere, nu de slăbire.'; }
  else if (goal === 'slab' && p.age < 18) { goal = 'ton'; note = 'Sub 18 ani nu recomandăm deficit caloric. Am calculat calorii de menținere.'; }
  const floor = Math.max(bmr * 1.05, p.sex === 'f' ? 1300 : 1600);
  let kcal = goal === 'masa' ? tdee * 1.12 : goal === 'slab' ? Math.max(tdee * 0.82, floor) : tdee;
  kcal = Math.round(kcal / 50) * 50;
  /* proteinele se raportează la o greutate de referință, ca să nu iasă exagerate la greutăți mari */
  const refW = Math.min(w, 25 * Math.pow(p.h / 100, 2));
  let prot = refW * (goal === 'ton' ? 1.8 : 2.0);
  prot = Math.round(Math.min(prot, kcal * 0.3 / 4) / 5) * 5;
  const auto = {kcal, prot};
  if (p.kcalO) kcal = goal === 'slab' || p.goal === 'slab' ? Math.max(p.kcalO, Math.round(floor / 50) * 50) : p.kcalO;
  if (p.protO) prot = p.protO;
  const fat = Math.round(Math.max(0.8 * refW, kcal * 0.25 / 9));
  const carb = Math.max(0, Math.round((kcal - prot * 4 - fat * 9) / 4));
  const water = Math.round(w * 0.035 * 4) / 4;

}

function mealCount(p, kcal) { return p.meals || (kcal < 1900 ? 4 : kcal < 2500 ? 5 : 6); }

/* Programul profilului: zile + exerciții (cu înlocuirile alese și seturi în plus la nivel intermediar) */
function buildDay(p, k, i) {
  const b = BLOCKS[k];
  return {i, k, name: b.n, sub: b.s, lib: i >= 100, ex: b.e.map((e, j) => {
    const sw = p.swaps && p.swaps[k + ':' + e[0]];
    return {base: e[0], id: sw && EX[sw] ? sw : e[0], sets: e[1] + (p.level === 'int' && j < 2 ? 1 : 0), reps: e[2]};
  })};
}
function programKeys(p) { return (PROGRAMS[p.focus] || PROGRAMS.echilibrat)[p.days] || PROGRAMS.echilibrat[4]; }
function program(p) { return programKeys(p).map((k, i) => buildDay(p, k, i)); }
/* indicele unei zile: dacă antrenamentul e în programul tău, rămâne ziua din program (rotația continuă firesc) */

function dayByIndex(p, i) {
  const keys = programKeys(p);

  return buildDay(p, keys[Math.min(Math.max(0, i || 0), keys.length - 1)], Math.min(Math.max(0, i || 0), keys.length - 1));
}

function repRange(reps) { const m = String(reps).match(/(\d+)\D+(\d+)/); return m ? [+m[1], +m[2]] : [+reps || 0, +reps || 0]; }
function restFor(id) { const k = EX[id].k; return k === 'i' ? 75 : k === 't' ? 60 : 120; }
function e1rm(w, r) { return w * (1 + r / 30); }
/* Scorul unui set, pentru recorduri: forța estimată; la greutatea corpului contează repetările,
   la tracțiunile asistate o contragreutate mai mică e mai bună, la plank contează secundele */
function score(id, x) {
  const e = EX[id]; if (!e) return 0;
  if (e.k === 't') return x.r;
  if (e.assist) return 300 - (x.w || 0) + x.r / 100;
  return e1rm(x.w || 0, x.r) + x.r / 100;
}
function okSets(ses, id) { return ((ses && ses.sets && ses.sets[id]) || []).filter(s => s && s.ok); }

/* Ultima ședință (înainte de `before`) în care exercițiul a fost făcut */
function lastPerf(p, id, before) {
  const ss = p.sessions || [];
  for (let i = ss.length - 1; i >= 0; i--) {
    if (before && ss[i].d >= before) continue;
    const s = okSets(ss[i], id);
    if (s.length) return {d: ss[i].d, sets: s};
  }
  return null;
}

/* Progresie dublă: întâi repetări până la capătul intervalului, apoi greutate */
function suggest(p, ex, today) {
  const e = EX[ex.id], last = lastPerf(p, ex.id, today), rr = repRange(ex.reps);
  if (!last) {
    if (e.k === 't') return {text: 'Prima dată: ține poziția cât poți corect, chiar dacă sunt mai puțin de ' + rr[0] + ' secunde.'};
    return {text: 'Prima dată: alege o greutate cu care termini seturile simțind că mai puteai face 2-3 repetări.'};
  }
  const top = last.sets.reduce((a, b) => (b.w > a.w ? b : a), last.sets[0]);
  if (e.k === 't') {
    const best = Math.max.apply(null, last.sets.map(s => s.r));
    return {w: 0, r: Math.min(rr[1] + 15, best + 5), last, text: 'Data trecută: ' + last.sets.map(s => s.r + ' s').join(' · ') + '. Azi încearcă +5 secunde.'};
  }
  const lastTxt = last.sets.map(s => (s.w ? fmtN(s.w) + ' kg × ' : '') + s.r).join(' · ');
  const allTop = last.sets.length >= Math.min(ex.sets, 2) && last.sets.every(s => s.r >= rr[1]);
  if (allTop && !top.w && !e.assist) return {w: 0, r: rr[1], up: true, last, text: 'Data trecută: ' + lastTxt + '. Ai atins maximul de repetări: ține o ganteră sau un disc ușor ca să crești dificultatea.'};
  if (allTop && top.w > 0) {
    /* pași mici: 2 kg pe ganteră, 2,5 kg la bară; 5 kg la picioare doar peste 40 kg */
    const db = /ganter/i.test(e.eq);
    const inc = db && e.k !== 'i' ? 2 : e.k === 'l' ? (top.w >= 40 ? 5 : 2.5) : e.k === 'c' ? 2.5 : 0;
    if (ex.id === 'asstpull') return {w: Math.max(0, top.w - 5), r: rr[0], last, text: 'Data trecută: ' + lastTxt + '. Ai atins maximul de repetări: scade contragreutatea cu un pas.'};
    if (inc) return {w: top.w + inc, r: rr[0], last, text: 'Data trecută: ' + lastTxt + '. Ai atins ' + rr[1] + ' repetări la toate seturile: urcă la ' + fmtN(top.w + inc) + ' kg.'};
    return {w: top.w, r: rr[0], up: true, last, text: 'Data trecută: ' + lastTxt + '. Ai atins maximul de repetări: treci la următoarea greutate disponibilă.'};
  }
  const minR = Math.min.apply(null, last.sets.map(s => s.r));
  return {w: top.w, r: Math.min(rr[1], minR + 1), last, text: 'Data trecută: ' + lastTxt + '. Păstrează greutatea și încearcă o repetare în plus.'};
}

function fmtN(n) { return (Math.round(n * 100) / 100).toString().replace('.', ','); }

/* ---------- NUTRIȚIE: porții calculate pe ținta fiecărei mese ---------- */
function mac(id, g) { const a = ING[id]; return {k: a.k * g / 100, p: a.p * g / 100, c: a.c * g / 100, f: a.f * g / 100}; }
function roundQty(id, g) {
  const a = ING[id];
  if (a.u) { const st = a.st || 1; return Math.max(st, Math.round(g / a.u / st) * st) * a.u; }
  const step = a.ml ? (g < 100 ? 10 : 50) : (g < 40 ? 5 : 10);
  return Math.max(step, Math.round(g / step) * step);
}
function qtyText(it) {
  const a = ING[it.id];
  if (a.u) {
    const n = Math.round(it.g / a.u * 2) / 2, whole = Math.floor(n), half = n - whole > 0;
    const q = (whole ? whole : '') + (half ? '½' : '');
    return q + ' ' + (n <= 1 ? a.one : a.many);
  }
  return it.g + (a.ml ? ' ml ' : ' g ') + a.n;
}

/* dacă porțiile ating limita realistă, restul caloriilor vine din alimente care se potrivesc firesc la masa respectivă */
const FILL = {m1: ['paine', 'miere'], m2: ['migdale'], m3: ['paine', 'ulei'], m4: ['miere', 'rondele'], m5: ['paine', 'ulei'], m6: ['nuci']};
function minStep(id) { const a = ING[id]; return a.u ? a.u * (a.st || 1) : a.ml ? 25 : 5; }
function capQty(id, g) {
  const a = ING[id]; if (!a.mx || g <= a.mx) return g;
  if (a.u) { const st = a.st || 1; return Math.max(st, Math.floor(a.mx / a.u / st) * st) * a.u; }
  return a.mx;
}
function solveMeal(rc, K, Pt, slot) {
  const base = rc.i.reduce((s, x) => s + mac(x[0], x[1]).k, 0);
  const s0 = clamp(K / base, 0.5, 1.8), sx = clamp(K / base, 0.6, 1.25);
  const fix = {k: 0, p: 0}, gp = {k: 0, p: 0}, gc = {k: 0, p: 0};
  rc.i.forEach(x => {
    const m = mac(x[0], x[2] === 'f' ? x[1] * s0 : x[2] === 'x' ? x[1] * sx : x[1]);
    const t = x[2] === 'p' ? gp : x[2] === 'c' ? gc : fix;
    t.k += m.k; t.p += m.p;
  });
  const LO = 0.4, HI = 2.3, CLO = 0.25, CHI = 3.2;
  let sp = 1, sc = 1;
  if (gp.k > 0 && gc.k > 0) {
    const det = gp.p * gc.k - gc.p * gp.k;
    if (Math.abs(det) > 1e-6) sp = ((Pt - fix.p) * gc.k - gc.p * (K - fix.k)) / det;
    sp = clamp(sp, LO, HI);
    sc = clamp((K - fix.k - sp * gp.k) / gc.k, CLO, CHI);
    sp = clamp((K - fix.k - sc * gc.k) / gp.k, LO, HI);
  } else if (gp.k > 0) sp = clamp((K - fix.k) / gp.k, LO, HI);
  else if (gc.k > 0) sc = clamp((K - fix.k) / gc.k, CLO, CHI);
  const items = rc.i.map(x => ({id: x[0], r: x[2], g: capQty(x[0], roundQty(x[0], x[1] * (x[2] === 'p' ? sp : x[2] === 'c' ? sc : x[2] === 'f' ? s0 : sx)))}));
  const sum = () => items.reduce((t, it) => { const m = mac(it.id, it.g); return {k: t.k + m.k, p: t.p + m.p, c: t.c + m.c, f: t.f + m.f}; }, {k: 0, p: 0, c: 0, f: 0});
  let tot = sum();
  (FILL[slot] || []).forEach(id => {
    const miss = K - tot.k; if (miss < 60) return;
    const it = items.find(x => x.id === id), have = it ? it.g : 0;
    const g = capQty(id, roundQty(id, have + Math.min(ING[id].mx - have, miss / ING[id].k * 100)));
    if (g <= have) return;

  for (let guard = 0; guard < 14 && tot.k > K * 1.06; guard++) {
    const cand = items.filter(it => (it.r === 'c' || it.r === 'f') && it.g > minStep(it.id)).sort((x, y) => mac(y.id, y.g).k - mac(x.id, x.g).k)[0];
    if (!cand) break;
    cand.g = Math.max(minStep(cand.id), cand.g - minStep(cand.id));
    tot = sum();

function hashStr(s) { let h = 7; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
/* Rotație: fiecare masă trece prin toate rețetele ei înainte să se repete */
function pickIdx(p, date, slot) {
  const f = p.food && p.food[date];
  if (f && f.pick && f.pick[slot] != null && RECIPES[slot][f.pick[slot]]) return f.pick[slot];
  const a = date.split('-').map(Number), day = Math.floor(Date.UTC(a[0], a[1] - 1, a[2]) / 86400000);

/* Meniul unei zile: fiecare masă primește o parte din calorii și proteine; două treceri de corecție
   aduc totalul zilei cât mai aproape de țintă */
function planDay(p, date, t) {
  t = t || targets(p);
  const set = SLOTSETS[mealCount(p, t.kcal)];
  const mainShare = set.filter(s => /m[135]/.test(s[0])).reduce((a, s) => a + s[1], 0);
  let extra = 0, kf = 1, meals = [], tot = null, best = null;
  for (let pass = 0; pass < 8; pass++) {
    meals = set.map(s => {
      const rc = RECIPES[s[0]][pickIdx(p, date, s[0])];
      const main = /m[135]/.test(s[0]);
      const m = solveMeal(rc, t.kcal * s[1] * kf, t.prot * s[1] + (main ? extra * s[1] / mainShare : 0), s[0]);
      m.slot = s[0]; m.idx = pickIdx(p, date, s[0]);
      return m;
    });
    tot = meals.reduce((a, m) => ({k: a.k + m.k, p: a.p + m.p, c: a.c + m.c, f: a.f + m.f}), {k: 0, p: 0, c: 0, f: 0});
    const dp = t.prot - tot.p, dk = t.kcal / tot.k;
    /* păstrează cea mai bună variantă: caloriile contează mai mult; proteinele doar să nu fie sub țintă */
    const err = Math.abs(dk - 1) * 100 * (dk < 1 && t.goal === 'slab' ? 1.5 : 1) + Math.max(0, dp) / t.prot * 30;

/* ---------- cronometru de pauză ---------- */
let timer = null, actx = null, wake = null;
function primeAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} }
function beep() {
  try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
  try {
    if (!actx) return;
    [0, 0.28].forEach(dt => { const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + dt; o.frequency.value = 880; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(0.3, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.22); o.start(t0); o.stop(t0 + 0.24); });
  } catch (e) {}
}

function stopTimer() { if (timer) clearInterval(timer.int); timer = null; const b = $('#timer'); if (b) { b.hidden = true; b.classList.remove('fin'); } }
function tick() {
  const bar = $('#timer'); if (!timer || !bar) return;
  const left = Math.ceil((timer.end - Date.now()) / 1000);
  bar.hidden = false;
  if (left <= 0) {
    if (!timer.fin) { timer.fin = Date.now(); beep(); bar.classList.add('fin'); $('#timer-t').textContent = 'Gata, următorul set!'; $('#timer-fill').style.width = '100%'; }
    else if (Date.now() - timer.fin > 8000) stopTimer();
    return;
  }
  bar.classList.remove('fin');
  $('#timer-t').textContent = 'Pauză ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
  $('#timer-fill').style.width = clamp(100 - left / timer.total * 100, 0, 100) + '%';
}

function spark(vals) {

  const pts = vals.map((v, i) => [(i / (vals.length - 1)) * (W - 12) + 6, H - 8 - ((v - mn) / sp) * (H - 16)]);
  const l = pts[pts.length - 1];
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Evoluție"><polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="' + pts.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ') + '"/><circle cx="' + l[0].toFixed(1) + '" cy="' + l[1].toFixed(1) + '" r="4.5" fill="var(--accent)"/></svg>';
}
function bwAdvice(p) {

  const r = 'Ritm: ' + (kg >= 0 ? '+' : '−') + fmtN(Math.abs(Math.round(kg * 100) / 100)) + ' kg pe săptămână. ';

    '<div class="fld"><span>Culoarea profilului</span><div class="opts sw">' + Object.keys(ACCENTS).map(k => '<label class="opt swatch"><input type="radio" data-in="form" name="accent" value="' + k + '"' + (d.accent === k ? ' checked' : '') + '><span style="--c:' + ACCENTS[k][0] + '" aria-label="' + k + '"></span></label>').join('') + '</div></div></section>'
  ];
  let h = '<header class="top"><div><div class="eyebrow">' + (!wiz ? 'Modifică profilul' : first ? 'Bine ai venit' : 'Profil nou') + '</div><h1>' + (!wiz ? esc(d.name || '') : first && step === 0 ? 'Training Master' : STEPS[step]) + '</h1></div></header>';
  if (wiz) {
    h += '<div class="steps" aria-label="Pasul ' + (step + 1) + ' din 4">' + STEPS.map((x, i) => '<span class="' + (i < step ? 'done' : i === step ? 'on' : '') + '"></span>').join('') + '</div>';
    if (step === 0) h += '<p class="lead">Spune-mi câteva lucruri despre tine și îți construiesc planul de antrenament și meniul, cu porții calculate pe măsura ta.</p>';
  }
  h += '<form id="pform" novalidate>' + (wiz ? sec[step] : sec.join(''));
  if (f.err) h += '<p class="advice warn" id="ferr">' + esc(f.err) + '</p>';
  if (wiz) h += '<div class="row2 wiz">' + (step > 0 ? '<button type="button" class="btn ghost" data-act="fback">Înapoi</button>' : first ? '<span></span>' : '<button type="button" class="btn ghost" data-act="cancelform">Renunță</button>') +
    (step < 3 ? '<button type="button" class="btn" data-act="fnext">Continuă</button>' : '<button type="submit" class="btn">Construiește planul</button>') + '</div></form>';
  else h += '<button type="submit" class="btn big">Salvează modificările</button><button type="button" class="btn ghost big" data-act="cancelform">Renunță</button></form>';
  return h;
}
function submitForm() {
  const f = ui.form, d = f.d, age = num(d.age), hh = num(d.h), w = num(d.w), name = String(d.name || '').trim();
  const err = stepErr(d, -1);
  if (err) { f.err = err; render(); const el = $('#ferr'); if (el) el.scrollIntoView({block: 'center'}); return; }
  const today = TODAY(), vals = {name, sex: d.sex, age: Math.round(age), h: Math.round(hh), w, act: d.act, goal: d.goal, level: d.level, days: +d.days, focus: d.focus, meals: +d.meals || 0, accent: d.accent || 'rust'};
  let p, isNew = f.mode !== 'edit';
  if (isNew) { p = normProfile(Object.assign({id: 'p' + Date.now().toString(36), created: today}, vals)); p.bw.push({d: today, w}); S.profiles[p.id] = p; S.active = p.id; }
  else {
    p = P(); const wOld = curWeight(p); Object.assign(p, vals);
    if (Math.abs(wOld - w) > 0.01) { p.bw = p.bw.filter(x => x.d !== today); p.bw.push({d: today, w}); }
  }
  ui.form = null; ui.day = null; ui.open = null; ui.tab = isNew ? 'train' : 'me';
  save(); render(); window.scrollTo(0, 0);
  if (isNew) openSheet(vPlanSheet(p));
}
function vPlanSheet(p) {
  const t = targets(p), prog = program(p);
  return '<h3>Planul tău este gata, ' + esc(p.name) + '</h3><p class="kv">' + GOALS[p.goal] + ' · ' + FOCUS[p.focus].toLowerCase() + '</p><ol class="plan">' + prog.map(d => '<li><b>' + esc(d.name) + '</b><span>' + esc(d.sub) + '</span></li>').join('') + '</ol>' +
    '<div class="tgrid"><div><b>' + fmtK(t.kcal) + '</b><span>kcal pe zi</span></div><div><b>' + t.prot + ' g</b><span>proteine</span></div><div><b>' + mealCount(p, t.kcal) + '</b><span>mese</span></div><div><b>' + fmtN(t.water) + ' l</b><span>apă</span></div></div>' +
    (t.note ? '<p class="advice warn">' + esc(t.note) + '</p>' : '') + '<button class="btn big" data-act="closesheet">Hai la treabă</button>';
}

/* ---------- foi (ferestre de jos) și mesaje ---------- */
function openSheet(html) { const s = $('#sheet'); $('#sheet-in').innerHTML = html; s.hidden = false; document.body.classList.add('noscroll'); $('#sheet-in').scrollTop = 0; }
function closeSheet() { $('#sheet').hidden = true; document.body.classList.remove('noscroll'); }
let toastT = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }
function curDay() { return dayByIndex(P(), ui.day == null ? 0 : ui.day); }

/* ---------- ACȚIUNI ---------- */
const ACT = {
  tab(el) { ui.tab = el.dataset.tab; render(); window.scrollTo(0, 0); },
  day(el) { ui.day = +el.dataset.i; ui.open = null; rerender(); },
  picker() { openSheet(vPicker(P())); ANIM.scan(); },
  pickday(el) {
    ui.day = +el.dataset.i; ui.open = null; closeSheet(); render(); window.scrollTo(0, 0);
    toast('Antrenamentul de azi: ' + curDay().name);
  },
  jump(el) { const t = document.getElementById(el.dataset.to), box = $('#sheet-in'); if (t && box) box.scrollTo({top: t.offsetTop - 8, behavior: 'smooth'}); },
  start() {
    const p = P(), day = curDay(), ses = findSession(p, TODAY(), day.i), nx = day.ex.find(x => !ses || okSets(ses, x.id).length < x.sets);
    if (!nx) return;
    ui.open = nx.id; rerender();
    const c = $('#ex-' + nx.id); if (c) window.scrollTo(0, window.scrollY + c.getBoundingClientRect().top - 12);
  },
  ex(el) { ui.open = ui.open === el.dataset.id ? null : el.dataset.id; rerender(); const c = $('#ex-' + el.dataset.id); if (c && ui.open) { const r = c.getBoundingClientRect(); if (r.top < 0 || r.top > window.innerHeight * 0.6) window.scrollTo(0, window.scrollY + r.top - 80); } },
  chk(el) {
    const p = P(), today = TODAY(), day = curDay(), id = el.dataset.id, j = +el.dataset.j, ex = day.ex.find(x => x.id === id), e = EX[id];
    if (!ex) return;
    const ses = ensureSession(p, today, day), rows = ses.sets[id] || (ses.sets[id] = []);
    for (let k = 0; k <= j; k++) rows[k] = rows[k] || {};
    const row = rows[j];
    if (row.ok) { row.ok = 0; save(); rerender(); return; }
    primeAudio();
    const box = el.closest('.set'), wi = $('[data-f=w]', box), ri = $('[data-f=r]', box), sg = suggest(p, ex, today);
    const prev = rows.slice(0, j).reverse().find(x => x && x.ok);
    let w = wi ? num(wi.value) : 0, r = num(ri.value);
    if (wi && w == null) w = prev ? prev.w : sg.w != null ? sg.w : e.bw ? 0 : null;
    if (r == null) r = sg.r != null ? sg.r : prev ? prev.r : null;
    if (w == null || r == null) { toast(e.k === 't' ? 'Scrie câte secunde ai ținut.' : 'Scrie greutatea și repetările.'); (w == null && wi ? wi : ri).focus(); return; }
    if (w < 0 || w > 600 || r < 1 || r > (e.k === 't' ? 900 : 100)) { toast('Verifică valorile introduse.'); return; }
    row.w = Math.round(w * 100) / 100; row.r = Math.round(r); row.ok = 1;
    if (!ses.t0) ses.t0 = Date.now();
    ses.t1 = Date.now(); ses.done = false;
    save(); keepAwake(); startTimer(restFor(id)); rerender();
  },
  addset(el) { const p = P(), day = curDay(), id = el.dataset.id, ex = day.ex.find(x => x.id === id), ses = ensureSession(p, TODAY(), day), rows = ses.sets[id] || (ses.sets[id] = []); while (rows.length < ex.sets) rows.push({}); if (rows.length >= 8) return toast('Opt seturi sunt de ajuns.'); rows.push({}); save(); rerender(); },
  delset(el) { const p = P(), ses = findSession(p, TODAY(), curDay().i); if (ses && ses.sets[el.dataset.id]) { ses.sets[el.dataset.id].pop(); save(); rerender(); } },
  swap(el) {
    const base = el.dataset.base, cur = el.dataset.id, list = [base].concat(EX[base].alt);
    openSheet('<h3>Înlocuiește exercițiul</h3><p class="fine">Aparat ocupat sau exercițiu care nu ți se potrivește? Alege o variantă care lucrează aceiași mușchi. Alegerea rămâne salvată pentru ziua aceasta din plan.</p><ul class="list tap">' + list.map(id => '<li data-act="swapset" data-base="' + base + '" data-to="' + id + '"><span>' + esc(EX[id].n) + '<small>' + esc(EX[id].eq) + '</small></span><b>' + (id === cur ? 'ales' : id === base ? 'original ›' : 'Alege ›') + '</b></li>').join('') + '</ul><button class="btn ghost big" data-act="closesheet">Închide</button>');
  },
  swapset(el) { const p = P(), day = curDay(), key = day.k + ':' + el.dataset.base; if (el.dataset.to === el.dataset.base) delete p.swaps[key]; else p.swaps[key] = el.dataset.to; ui.open = el.dataset.to; save(); closeSheet(); rerender(); },
  finish() {
    const p = P(), today = TODAY(), ses = findSession(p, today, curDay().i); if (!ses) return;
    ses.done = true; ses.t1 = Date.now(); save(); stopTimer(); releaseWake();
    const prs = [];
    Object.keys(ses.sets).forEach(id => { if (!EX[id]) return; const old = bestBefore(p, id, today); if (!old) return; const now = Math.max.apply(null, okSets(ses, id).map(x => score(id, x)).concat([0])); if (now > old + 0.001) prs.push(EX[id].n); });
    const mins = ses.t0 ? Math.max(1, Math.round((ses.t1 - ses.t0) / 60000)) : 0;
    openSheet('<h3>Bravo, ' + esc(p.name) + '!</h3><div class="tgrid"><div><b>' + sesSetCount(ses) + '</b><span>seturi</span></div><div><b>' + fmtK(sesVolume(ses)) + '</b><span>kg volum</span></div><div><b>' + (mins || '—') + '</b><span>minute</span></div><div><b>' + weekDates(p, today) + '/' + p.days + '</b><span>săptămâna</span></div></div>' +
      (prs.length ? '<div class="advice good"><p><b>Recorduri noi:</b> ' + prs.map(esc).join(', ') + '.</p></div>' : '') + '<p class="fine">Mănâncă o masă cu proteine în următoarele două ore și bea apă.</p><button class="btn big" data-act="closesheet">Gata</button>');
    ui.open = null; rerender();
  },
  reopen() { const ses = findSession(P(), TODAY(), curDay().i); if (ses) { ses.done = false; save(); rerender(); } },
  deload() { P().deload = TODAY(); save(); rerender(); },
  tminus() { if (timer) { timer.end -= 15000; tick(); } },
  tplus() { if (timer) { timer.end += 15000; timer.total += 15; timer.fin = 0; tick(); } },
  tskip() { stopTimer(); },

  eat(el) { const f = foodDay(P(), TODAY()); f.eat[el.dataset.slot] = f.eat[el.dataset.slot] ? 0 : 1; save(); rerender(); },
  meal(el) { ui.meal = ui.meal === el.dataset.slot ? null : el.dataset.slot; rerender(); },
  reroll(el) { const p = P(), d = TODAY(), slot = el.dataset.slot, f = foodDay(p, d), n = RECIPES[slot].length, cur = pickIdx(p, d, slot); f.pick[slot] = (cur + 1 + Math.floor(Math.random() * (n - 1))) % n; ui.meal = slot; save(); rerender(); },
  shuffle() { const p = P(), d = TODAY(), f = foodDay(p, d); Object.keys(RECIPES).forEach(slot => { const n = RECIPES[slot].length, cur = pickIdx(p, d, slot); f.pick[slot] = (cur + 1 + Math.floor(Math.random() * (n - 1))) % n; }); ui.meal = null; save(); rerender(); toast('Meniu nou pentru azi.'); },
  water(el) { const f = foodDay(P(), TODAY()); f.water = clamp((f.water || 0) + (+el.dataset.d), 0, 30); save(); rerender(); },
  shop() {
    const plan = planDay(P(), TODAY()), sum = {};
    plan.meals.forEach(m => m.items.forEach(it => { sum[it.id] = (sum[it.id] || 0) + it.g; }));
    const lines = Object.keys(sum).map(id => qtyText({id, g: sum[id]})).sort((a, b) => a.replace(/^[\d½\s]+(g|ml)?\s*/, '').localeCompare(b.replace(/^[\d½\s]+(g|ml)?\s*/, ''), 'ro'));
    ui.shopText = 'Ingrediente pentru meniul de azi:\n' + lines.map(l => '• ' + l).join('\n');
    openSheet('<h3>Ingrediente pentru meniul de azi</h3><p class="fine">Cantitățile sunt pentru o singură persoană, adunate din toate mesele zilei. Carnea, peștele, orezul și pastele sunt cântărite crude.</p><ul class="ingr">' + lines.map(l => '<li>' + esc(l) + '</li>').join('') + '</ul><div class="row2"><button class="btn" data-act="copyshop">Copiază lista</button><button class="btn ghost" data-act="closesheet">Închide</button></div>');
  },
  copyshop() { const done = () => toast('Lista a fost copiată.'); try { navigator.clipboard.writeText(ui.shopText).then(done, () => toast('Nu am putut copia lista.')); } catch (e) { toast('Nu am putut copia lista.'); } },

  bwsave() {
    const p = P(), w = num($('#bw-w').value), c = num($('#bw-c').value), today = TODAY();
    if (!w || w < 35 || w > 250) return toast('Scrie greutatea în kilograme.');
    if (c != null && (c < 40 || c > 200)) return toast('Talia trebuie să fie între 40 și 200 cm.');
    p.bw = p.bw.filter(x => x.d !== today); const e = {d: today, w}; if (c) e.c = c; p.bw.push(e); p.w = w;
    save(); rerender(); toast('Cântărire salvată.');
  },
  applykcal(el) { const p = P(); p.kcalO = +el.dataset.k; save(); rerender(); toast('Ținta de calorii a fost actualizată.'); },
  hist(el) { ui.hist = ui.hist === el.dataset.k ? null : el.dataset.k; rerender(); },
  delses(el) { if (!confirm('Ștergi această ședință din istoric?')) return; const p = P(), a = el.dataset.k.split('|'); p.sessions = p.sessions.filter(s => !(s.d === a[0] && s.i === +a[1])); ui.hist = null; save(); rerender(); },
  exhist(el) {
    const p = P(), id = el.dataset.id, e = EX[id], rows = [];
    p.sessions.forEach(s => { const o = okSets(s, id); if (o.length) rows.push({d: s.d, sets: o, v: Math.max.apply(null, o.map(x => score(id, x)))}); });
    openSheet('<h3>' + esc(e.n) + '</h3><p class="fine">' + (e.k === 't' ? 'Cel mai lung set din fiecare ședință.' : e.assist ? 'O contragreutate mai mică înseamnă progres.' : 'Evoluția forței estimate (greutate și repetări combinate).') + '</p>' + spark(rows.slice(-14).map(r => r.v)) + '<ul class="list">' + rows.slice(-10).reverse().map(r => '<li><span>' + fmtD(r.d, {day: 'numeric', month: 'short', year: 'numeric'}) + '</span><b>' + r.sets.map(x => (e.k === 't' ? x.r + ' s' : (x.w ? fmtN(x.w) + '×' : '') + x.r)).join(' · ') + '</b></li>').join('') + '</ul><button class="btn ghost big" data-act="closesheet">Închide</button>');
  },

  profiles() {
    const p = P();
    openSheet('<h3>Cine se antrenează?</h3><ul class="list tap">' + Object.values(S.profiles).map(o => '<li data-act="switch" data-id="' + o.id + '"><span><i class="dot" style="background:' + (ACCENTS[o.accent] || ACCENTS.rust)[0] + '"></i>' + esc(o.name) + '<small>' + GOALS[o.goal] + ' · ' + o.days + ' zile</small></span><b>' + (o.id === p.id ? 'activ' : 'Alege ›') + '</b></li>').join('') + '</ul><div class="row2"><button class="btn ghost" data-act="newprofile">Adaugă profil</button><button class="btn ghost" data-act="closesheet">Închide</button></div>');
  },
  'switch'(el) { if (S.profiles[el.dataset.id]) { S.active = el.dataset.id; ui.day = null; ui.open = null; ui.meal = null; ui.hist = null; stopTimer(); save(); closeSheet(); render(); window.scrollTo(0, 0); toast('Profil activ: ' + P().name); } },
  newprofile() { const used = Object.values(S.profiles).map(o => o.accent), free = Object.keys(ACCENTS).find(k => used.indexOf(k) < 0) || 'rust'; closeSheet(); ui.form = {mode: 'new', d: {accent: free, meals: 0}}; render(); window.scrollTo(0, 0); },
  edit() { const p = P(); ui.form = {mode: 'edit', touched: true, d: {name: p.name, sex: p.sex, age: p.age, h: p.h, w: fmtN(curWeight(p)), act: p.act, goal: p.goal, level: p.level, days: p.days, focus: p.focus, meals: p.meals || 0, accent: p.accent}}; render(); window.scrollTo(0, 0); },
  cancelform() { ui.form = null; render(); window.scrollTo(0, 0); },
  fnext() {
    const f = ui.form, err = stepErr(f.d, f.step || 0);
    if (err) { f.err = err; render(); const el = $('#ferr'); if (el) el.scrollIntoView({block: 'center'}); return; }
    f.err = ''; f.step = Math.min(3, (f.step || 0) + 1); render(); window.scrollTo(0, 0);
  },
  fback() { const f = ui.form; f.err = ''; f.step = Math.max(0, (f.step || 0) - 1); render(); window.scrollTo(0, 0); },
  delprofile() { const p = P(); if (!confirm('Ștergi profilul „' + p.name + '” cu tot istoricul lui? Nu se poate anula.')) return; delete S.profiles[p.id]; S.active = Object.keys(S.profiles)[0] || null; ui.day = null; ui.tab = 'train'; save(); render(); window.scrollTo(0, 0); },
  osave() {
    const p = P(), k = num($('#o-k').value), pr = num($('#o-p').value);
    if (k != null && (k < 1200 || k > 6000)) return toast('Caloriile trebuie să fie între 1.200 și 6.000.');
    if (pr != null && (pr < 40 || pr > 350)) return toast('Proteinele trebuie să fie între 40 și 350 g.');
    if (k) p.kcalO = Math.round(k); else delete p.kcalO;
    if (pr) p.protO = Math.round(pr); else delete p.protO;
    save(); rerender(); toast('Țintele au fost salvate.');
  },
  'export'() {
    const name = 'training-master-' + TODAY() + '.json', text = JSON.stringify(S);
    try {
      const file = new File([text], name, {type: 'application/json'});
      if (navigator.canShare && navigator.canShare({files: [file]})) { navigator.share({files: [file], title: 'Copie de siguranță'}).catch(() => {}); return; }
    } catch (e) {}
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: 'application/json'})); a.download = name; document.body.appendChild(a); a.click(); a.remove();
    toast('Copia a fost descărcată.');
  },
  'import'() { $('#imp').click(); },
  animtoggle() { ANIM.toggle(); },
  closesheet() { closeSheet(); },
  sheetbg(el, e) { if (e.target === el) closeSheet(); }
};

document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el, e); });
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset) return;
  if (el.dataset.in === 'set') {
    /* valorile scrise se păstrează ca ciornă chiar dacă setul nu e încă bifat */
    const p = P(), day = curDay(), id = el.dataset.id, j = +el.dataset.j, f = el.dataset.f;
    const ses = ensureSession(p, TODAY(), day), rows = ses.sets[id] || (ses.sets[id] = []);
    for (let k = 0; k <= j; k++) rows[k] = rows[k] || {};
    const v = num(el.value);
    if (v == null || v < 0) { if (!rows[j].ok) delete rows[j][f]; }
    else rows[j][f] = f === 'r' ? Math.round(v) : v;
    save();
  } else if (el.dataset.in === 'form' && ui.form && el.type !== 'radio') ui.form.d[el.name] = el.value;
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'imp' && el.files && el.files[0]) {
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const data = JSON.parse(rd.result);
        if (!data || !data.profiles || !Object.keys(data.profiles).length) throw new Error('gol');
        Object.values(data.profiles).forEach(o => { if (!o.id || !o.name || !o.sex || !o.h) throw new Error('profil'); });
        if (!confirm('Restaurarea înlocuiește toate datele din aplicație cu cele din copie. Continui?')) return;
        S = {v: 2, active: data.active, profiles: data.profiles}; Object.values(S.profiles).forEach(normProfile);
        if (!S.profiles[S.active]) S.active = Object.keys(S.profiles)[0];
        ui.day = null; save(); render(); toast('Datele au fost restaurate.');
      } catch (err) { toast('Fișierul nu este o copie validă.'); }
    };
    rd.readAsText(el.files[0]); el.value = '';
    return;
  }
  if (el.dataset && el.dataset.in === 'form' && el.type === 'radio' && ui.form) {
    const f = ui.form, d = f.d;
    d[el.name] = el.value;
    if (el.name === 'focus') f.touched = true;
    if (el.name === 'sex' && !f.touched) d.focus = el.value === 'f' ? 'inferior' : 'echilibrat';
    f.err = '';
    rerender();
  }
});
document.addEventListener('submit', e => { if (e.target.id !== 'pform') return; e.preventDefault(); if (ui.form && ui.form.mode !== 'edit' && (ui.form.step || 0) < 3) ACT.fnext(); else submitForm(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (ui.lastDate !== ymd()) { ui.lastDate = ymd(); ui.day = null; if (!ui.form) rerender(); }
  const p = P(); if (p && p.sessions.some(s => s.d === TODAY() && !s.done && hasOk(s))) keepAwake();
  tick();
});

render();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
